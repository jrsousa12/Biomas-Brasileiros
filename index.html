<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f5132">
<title>Trilhas dos Biomas Brasileiros – 7º ano</title>
<style>
:root{--bg:#f3f7f2;--ink:#1d2b21;--mut:#5c6b60;--card:#fff;--c1:#1b8a4b;--c2:#0d5c33;--ok:#1e9e5a;--bad:#d64545;--gold:#f2b705}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:16px;line-height:1.45;min-height:100vh}
#app{max-width:560px;margin:0 auto;padding-bottom:84px}
header.top{background:linear-gradient(135deg,var(--c1),var(--c2));color:#fff;padding:18px 16px 16px;border-radius:0 0 22px 22px;position:relative}
header.top h1{margin:0;font-size:20px;line-height:1.2}
header.top .sub{opacity:.9;font-size:13px;margin-top:2px}
.xpbar{height:10px;background:rgba(255,255,255,.25);border-radius:6px;margin-top:10px;overflow:hidden}
.xpbar i{display:block;height:100%;background:var(--gold);border-radius:6px;transition:width .5s}
.xpline{display:flex;justify-content:space-between;font-size:12px;margin-top:5px;opacity:.95}
main{padding:14px 14px 0}
h2{font-size:18px;margin:6px 0 10px}
.card{background:var(--card);border-radius:16px;padding:14px;box-shadow:0 2px 8px rgba(0,0,0,.07);margin-bottom:12px}
.btn{display:block;width:100%;border:0;border-radius:14px;padding:14px;font-size:16px;font-weight:700;color:#fff;background:linear-gradient(135deg,var(--c1),var(--c2));cursor:pointer;margin-top:10px}
.btn.sec{background:#e4ebe4;color:var(--ink)}
.btn:disabled{opacity:.5}
.btn:active{transform:scale(.98)}
.small{font-size:13px;color:var(--mut)}
.landbar{display:flex;height:22px;border-radius:11px;overflow:hidden;margin:6px 0 4px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}
.landbar b{display:block;height:100%;cursor:pointer;min-width:4px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{border-radius:16px;padding:12px;color:#fff;cursor:pointer;position:relative;min-height:128px;display:flex;flex-direction:column;justify-content:space-between;box-shadow:0 3px 8px rgba(0,0,0,.15)}
.tile .em{font-size:34px;line-height:1}
.tile h3{margin:4px 0 0;font-size:16px}
.tile .pc{font-size:12px;opacity:.95}
.tile .st{font-size:12px;font-weight:700;background:rgba(0,0,0,.22);padding:4px 8px;border-radius:10px;align-self:flex-start;margin-top:6px}
.tile .medal{position:absolute;top:8px;right:10px;font-size:22px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid #dde5dd;display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom);z-index:10}
nav.tabs div{display:flex;width:100%;max-width:560px}
nav.tabs button{flex:1;background:none;border:0;padding:9px 2px 8px;font-size:11px;color:var(--mut);cursor:pointer}
nav.tabs button span{display:block;font-size:22px;line-height:1.1}
nav.tabs button.on{color:var(--c2);font-weight:700}
.prog{height:8px;background:#e2e9e2;border-radius:5px;overflow:hidden;margin:2px 0 12px}
.prog i{display:block;height:100%;background:var(--c1);transition:width .3s}
.q{font-size:18px;font-weight:700;margin:6px 0 12px}
.opt{display:block;width:100%;text-align:left;background:#fff;border:2px solid #d6e0d6;border-radius:14px;padding:13px 14px;margin-bottom:9px;font-size:16px;cursor:pointer;color:var(--ink)}
.opt:active{transform:scale(.98)}
.opt.right{border-color:var(--ok);background:#e5f6ec}
.opt.wrong{border-color:var(--bad);background:#fdeaea}
.opt:disabled{cursor:default}
.fb{border-radius:14px;padding:12px 14px;margin:10px 0;font-size:15px}
.fb.ok{background:#e5f6ec;border:1px solid var(--ok)}
.fb.bad{background:#fdeaea;border:1px solid var(--bad)}
.slots{display:flex;flex-direction:column;gap:7px;margin-bottom:12px}
.slot{border:2px dashed #b9c8ba;border-radius:12px;padding:10px 12px;min-height:44px;display:flex;align-items:center;gap:8px;background:#fafcf9}
.slot b{background:var(--c1);color:#fff;width:24px;height:24px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:13px;flex:none}
.slot.ok{border-color:var(--ok);background:#e5f6ec}
.slot.bad{border-color:var(--bad);background:#fdeaea}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:#fff;border:2px solid var(--c1);color:var(--ink);border-radius:20px;padding:9px 14px;font-size:15px;cursor:pointer}
.chip:disabled{opacity:.35}
.lesson{font-size:16px}
.lesson .big{font-size:56px;text-align:center;margin:4px 0}
.lesson h3{margin:0 0 8px;font-size:20px}
.lesson ul{padding-left:20px;margin:8px 0}
.lesson li{margin-bottom:5px}
.dots{display:flex;gap:6px;justify-content:center;margin-bottom:10px}
.dots i{width:9px;height:9px;border-radius:50%;background:#cbd8cb}
.dots i.on{background:var(--c1)}
.sp{border-radius:18px;padding:14px;color:#fff;text-align:center;box-shadow:0 3px 8px rgba(0,0,0,.16);min-height:190px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start}
.sp .e{font-size:50px;line-height:1.1}
.sp h4{margin:6px 0 2px;font-size:15px}
.sp .tag{font-size:11px;font-weight:700;background:rgba(0,0,0,.28);padding:3px 8px;border-radius:9px;margin:3px 0}
.sp p{font-size:12px;margin:5px 0 0;opacity:.95}
.sp.lock{background:#c9d3c9;color:#6d7b6f;box-shadow:none;justify-content:center}
.sp.lock .e{font-size:44px;filter:grayscale(1);opacity:.5}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mito{border-radius:16px;background:#fff;padding:14px;margin-bottom:10px;box-shadow:0 2px 8px rgba(0,0,0,.07)}
.mito .row{display:flex;gap:8px;margin-top:8px}
.mito .row button{flex:1;padding:11px;border-radius:12px;border:2px solid #c6d3c6;background:#fff;font-size:15px;font-weight:700;cursor:pointer}
.mito .tagv{display:inline-block;font-weight:800;padding:3px 10px;border-radius:10px;color:#fff;margin-bottom:4px}
.big-result{text-align:center}
.big-result .m{font-size:70px}
.cert{border:6px double #b8860b;background:#fffdf3;padding:22px 14px;text-align:center;border-radius:6px}
.cert h2{font-size:24px;color:#8a6508;margin:0 0 6px}
.cert .nm{font-size:26px;font-weight:800;margin:10px 0;border-bottom:2px solid #b8860b;display:inline-block;padding:0 14px}
input.txt{width:100%;padding:13px;border:2px solid #cbd8cb;border-radius:12px;font-size:17px;margin-top:8px}
table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t td,table.t th{padding:7px 4px;border-bottom:1px solid #e3eae3;text-align:left}
pre.code{background:#f0f4ef;border-radius:12px;padding:10px;font-size:13px;white-space:pre-wrap;word-break:break-word}
.pop{animation:pop .35s ease}
@keyframes pop{0%{transform:scale(.85);opacity:0}100%{transform:scale(1);opacity:1}}
@media print{
 body *{visibility:hidden}
 #certArea,#certArea *{visibility:visible}
 #certArea{position:absolute;left:0;top:0;width:100%}
}
</style>
</head>

{id:"cer",nome:"Cerrado",emoji:"🌾",c1:"#d98a1f",c2:"#a85a00",pct:"23,3%",km:"1.984.554",lema:"A savana mais rica do mundo",
 cards:[

 q:[

  {t:"mc",q:"Por que o Cerrado é conhecido como “berço das águas”?",o:["Porque tem muitos lagos","Porque fica perto do mar","Porque contribui para 8 das 12 regiões hidrográficas do país","Porque chove o ano todo"],a:2,e:"Nascentes do Cerrado abastecem grandes bacias, como a do São Francisco, a do Tocantins-Araguaia e a do Paraná."},

  {t:"order",q:"Monte a cadeia alimentar, do produtor ao decompositor:",items:["Capim","Cupim","Tamanduá-bandeira","Fungos e bactérias"],e:"O capim é o produtor, o cupim o consumidor primário e o tamanduá-bandeira o consumidor secundário."},

  {t:"tf",q:"Verdadeiro ou falso: o Cerrado é um bioma pobre e sem importância.",a:false,e:"Falso. É a savana mais rica do mundo, com 12.829 plantas nativas, e abastece várias bacias hidrográficas."},

{id:"mat",nome:"Mata Atlântica",emoji:"🌴",c1:"#2a9d8f",c2:"#176b61",pct:"13,0%",km:"1.107.285",lema:"Do litoral ao interior",

{id:"caa",nome:"Caatinga",emoji:"🌵",c1:"#c8553d",c2:"#8d2f1c",pct:"10,1%",km:"862.652",lema:"Só existe no Brasil",
 cards:[
  {e:"☀️",h:"Mata branca",p:"<ul><li>“Caatinga” vem do tupi e quer dizer <b>“mata branca”</b>: na seca as árvores perdem as folhas e a mata fica clara.</li><li>Ocupa <b>10,1%</b> do Brasil: o Nordeste inteiro (menos parte do litoral e do Maranhão) e o norte de MG.</li><li>É o <b>único bioma exclusivamente brasileiro</b>.</li><li>Clima semiárido, chuva escassa e irregular, rios que secam em parte do ano.</li></ul>"},
  {e:"🌵",h:"Plantas espertas",p:"<ul><li><b>Mandacaru</b> e xique-xique: cactos típicos.</li><li><b>Umbuzeiro</b>: guarda água em estruturas das raízes (xilopódios).</li><li>Juazeiro, aroeira, catingueira e carnaúba também são típicas.</li><li>A Caatinga <b>não é pobre</b> em espécies: tem centenas de aves, peixes e répteis, muitos endêmicos.</li></ul>"},
  {e:"🐾",h:"Fauna e ameaças",p:"<ul><li>Animais: tatu-bola, guigó-da-caatinga, arara-azul-de-lear, soldadinho-do-araripe, preá, asa-branca.</li><li>Ameaças: lenha e carvão, pastoreio excessivo, tráfico de aves, <b>desertificação</b> e desmatamento ligado a usinas de energia.</li><li>Soluções: cisternas, <b>convivência com o semiárido</b> e plantio de espécies nativas.</li></ul>"}],
 q:[
  {t:"mc",q:"O que significa “Caatinga” em tupi?",o:["Mata branca","Terra seca","Chão de pedra","Rio escondido"],a:0,e:"Na seca, as árvores perdem as folhas e a mata fica esbranquiçada."},

  h+='<div class="small" style="margin-bottom:6px">Toque nos itens na ordem certa (do produtor ao decompositor).</div><div class="slots">';
  for(var k=0;k<q.items.length;k++){
   var txt=Q.pick[k]!==undefined?Q.ord[Q.pick[k]]:"";
   var cls="";if(Q.ans&&Q.pick[k]!==undefined){cls=Q.ord[Q.pick[k]]===q.items[k]?"ok":"bad"}
   h+='<div class="slot '+cls+'"><b>'+(k+1)+'</b><span>'+txt+'</span></div>';
  }
  h+='</div><div class="chips">'+Q.ord.map(function(t,i){return '<button class="chip" '+((Q.pick.indexOf(i)>=0||Q.ans)?"disabled":"")+' onclick="pickOrd('+i+')">'+t+'</button>'}).join("")+'</div>';
  if(!Q.ans)h+='<button class="btn sec" onclick="clearOrd()">Limpar</button>';
 }
 h+='</div>';
 if(Q.ans){
  h+='<div class="fb '+(Q.chk?"ok":"bad")+' pop"><b>'+(Q.chk?"✅ Muito bem! ":"❌ Quase lá! ")+'</b>'+q.e+(q.t==="order"&&!Q.chk?'<br><br><b>Ordem certa:</b> '+q.items.join(" → "):"")+'</div>';
  h+='<button class="btn" onclick="nextQ()">'+(Q.i===Q.list.length-1?"Ver resultado":"Próxima ▶")+'</button>';
 }
 h+='<button class="btn sec" onclick="quitQuiz()">Sair</button></main>';
 return h;
}
function finishAns(correct){
 var q=Q.list[Q.i];Q.ans=true;Q.chk=correct;
 if(correct){
  Q.ok++;
  if(!S.got[q.id]){S.got[q.id]=1;addXP(Q.mode==="review"?5:10)}
  var ix=S.wrong.indexOf(q.id);if(ix>=0){S.wrong.splice(ix,1);Q.fixed++}
 }else{if(S.wrong.indexOf(q.id)<0)S.wrong.push(q.id)}
 save();render();
}
function pickMC(i){if(Q.ans)return;Q.sel=i;finishAns(Q.opts[i].ok)}
function pickTF(i){if(Q.ans)return;Q.sel=i;var q=Q.list[Q.i];finishAns((i===0)===q.a)}
function pickOrd(i){
 if(Q.ans||Q.pick.indexOf(i)>=0)return;Q.pick.push(i);
 var q=Q.list[Q.i];
 if(Q.pick.length===q.items.length){
  var okk=Q.pick.every(function(p,k){return Q.ord[p]===q.items[k]});finishAns(okk)
 }else render();
}
function clearOrd(){Q.pick=[];render()}
function nextQ(){
 if(Q.i<Q.list.length-1){Q.i++;prepQ();render();window.scrollTo(0,0)}
 else endQuiz();
}
function quitQuiz(){view="home";tab="home";Q=null;render()}

function endQuiz(){
 var n=Q.list.length,ok=Q.ok,p=ok/n;
 var m=p>=0.9?"🥇":p>=0.7?"🥈":p>=0.5?"🥉":"💪";
 var msg=p>=0.9?"Incrível! Você domina este assunto!":p>=0.7?"Muito bom! Falta pouco para o ouro.":p>=0.5?"Bom começo! Revise os erros e tente de novo.":"Sem problema: aprender é isso. Releia os cartões e tente outra vez.";
 var extra="",btns="";
 if(Q.mode==="trail"){
  var b=bio(Q.bid),prev=S.trails[b.id];
  S.trails[b.id]={best:Math.max(prev?prev.best:0,ok),total:n,tries:(prev?prev.tries:0)+1,last:ok};
  var novas=0;b.sp.forEach(function(s){if(S.cards.indexOf(s.n)<0){S.cards.push(s.n);novas++}});
  addXP(prev?0:20);
  extra=novas?'<p>🃏 Você ganhou <b>'+novas+' cartas</b> de animais do bioma '+b.nome+'!</p>':'<p class="small">Suas cartas deste bioma já estão na coleção.</p>';
  if(!prev)extra+='<p class="small">+20 XP pela trilha concluída.</p>';
  btns='<button class="btn" onclick="go(\'cards\')">Ver minhas cartas</button><button class="btn sec" onclick="startTrail(\''+b.id+'\')">Refazer a trilha</button><button class="btn sec" onclick="go(\'home\')">Voltar às trilhas</button>';
 }else if(Q.mode==="final"){
  S.finalTries++;if(ok>S.final)S.final=ok;addXP(ok>=7&&!S.finalBonus?30:0);if(ok>=7)S.finalBonus=1;
  btns='<button class="btn" onclick="startFinal()">Jogar de novo</button><button class="btn sec" onclick="go(\'home\')">Voltar às trilhas</button>';
 }else{
  extra='<p>Você acertou de primeira '+Q.fixed+' questão(ões) que antes tinha errado.</p>';
  btns='<button class="btn sec" onclick="go(\'home\')">Voltar às trilhas</button>';
 }
 save();
 var h=headerHTML(Q.title,"Resultado")+'<main><div class="card big-result pop"><div class="m">'+m+'</div><h2>'+ok+' de '+n+' acertos</h2><p>'+msg+'</p>'+extra+'</div>'+btns;
 if(S.wrong.length&&Q.mode!=="review")h+='<button class="btn sec" onclick="startReview()">🔁 Revisar meus erros ('+S.wrong.length+')</button>';
 h+='</main>';
 view="end";document.getElementById("app").innerHTML=h;renderNav();window.scrollTo(0,0);
 document.querySelector("nav.tabs").style.display="flex";
}

/* ============ REVISÃO ============ */
function startReview(){
 var list=S.wrong.map(function(id){return QMAP[id]}).filter(Boolean);
 if(!list.length){
  document.getElementById("app").innerHTML=headerHTML("Revisão","Tudo certo!")+'<main><div class="card big-result"><div class="m">🎉</div><h2>Nada para revisar</h2><p>Você não tem questões erradas pendentes.</p><button class="btn" onclick="go(\'home\')">Voltar às trilhas</button></div></main>';
  view="end";renderNav();document.querySelector("nav.tabs").style.display="flex";return;
 }
 startQuiz({title:"🔁 Revisão de erros",list:list,mode:"review"});
}

/* ============ CARTAS ============ */
function vCards(){
 var tot=0,got=0,h="";
 BIOMES.forEach(function(b){
  h+='<h2 style="color:'+b.c2+'">'+b.emoji+' '+b.nome+'</h2><div class="grid2">';
  b.sp.forEach(function(s){
   tot++;var has=S.cards.indexOf(s.n)>=0;
   if(has){got++;h+='<div class="sp" style="background:linear-gradient(145deg,'+b.c1+','+b.c2+')"><div class="e">'+s.e+'</div><h4>'+s.n+'</h4>'+(s.st?'<div class="tag">'+s.st+'</div>':'')+'<p>'+s.f+'</p></div>'}
   else h+='<div class="sp lock"><div class="e">'+s.e+'</div><h4>?</h4><p>Conclua a trilha para desbloquear</p></div>';
  });
  h+='</div>';
 });
 return headerHTML("Minhas cartas 🃏",got+" de "+tot+" cartas")+'<main>'+h+'<p class="small" style="margin-top:14px">Status de ameaça: Lista Nacional de Fauna Ameaçada (MMA, Portaria 1.704/2026). Essas categorias podem mudar com novas avaliações.</p></main>';
}

/* ============ MITOS ============ */
function vMitos(){
 var h=MITOS.map(function(m,i){
  var r=S.mitos[i];
  var body;
  if(r===undefined){
   body='<div class="row"><button onclick="mitoAns('+i+',false)">🚫 Mito</button><button onclick="mitoAns('+i+',true)">✅ Verdade</button></div>';
  }else{
   body='<div class="pop" style="margin-top:8px"><span class="tagv" style="background:'+(m.v?"#1e9e5a":"#d64545")+'">'+(m.v?"VERDADE":"MITO")+'</span>'+(r===m.v?" 🎯 Você acertou!":" Dessa vez não.")+'<div class="small" style="color:var(--ink);margin-top:4px">'+m.e+'</div></div>';
  }
  return '<div class="mito"><b>“'+m.s+'”</b>'+body+'</div>';
 }).join("");
 return headerHTML("Mito ou verdade? 🧐","Descubra o que é fato e o que é boato")+'<main>'+h+'</main>';
}
function mitoAns(i,v){
 if(S.mitos[i]!==undefined)return;S.mitos[i]=v;if(v===MITOS[i].v)addXP(5);save();
 var y=window.scrollY;render();window.scrollTo(0,y)
}

/* ============ DESAFIO FINAL ============ */
function vFinal(){
 return headerHTML("Desafio final 🏆","10 questões sorteadas sobre todos os biomas")+'<main><div class="card"><p>Compare os biomas e descubra qual é qual pelas pistas.</p><p class="small">Melhor resultado: <b>'+S.final+'/10</b> • Tentativas: '+S.finalTries+'</p><button class="btn" onclick="startFinal()">Começar o desafio</button></div></main>';
}
function startFinal(){
 var pool=FINALPOOL.map(function(q){return{t:q.t,q:q.q,o:q.o.slice(),a:q.a,e:q.e,id:q.id,b:q.b}});
 startQuiz({title:"🏆 Desafio final",list:shuffle(pool).slice(0,10),mode:"final"});
}

/* ============ RESULTADO / PROFESSOR ============ */
function resumo(){
 var l=level();
 var t="BIOMAS 7º ANO – "+(S.name||"Aluno(a)")+"\nNível "+(l+1)+" ("+LNAMES[l]+") • "+S.xp+" XP\n";
 BIOMES.forEach(function(b){var r=S.trails[b.id];t+=b.nome+": "+(r?r.best+"/"+r.total+" (tentativas: "+r.tries+")":"não feita")+"\n"});
 t+="Desafio final: "+S.final+"/10\nCartas: "+S.cards.length+"/24\nMitos respondidos: "+Object.keys(S.mitos).length+"/"+MITOS.length+"\nQuestões para revisar: "+S.wrong.length;
 return t;
}
function vResult(){
 var done=BIOMES.filter(function(b){return S.trails[b.id]}).length;
 var rows=BIOMES.map(function(b){var r=S.trails[b.id];return '<tr><td>'+b.emoji+' '+b.nome+'</td><td>'+(r?r.best+'/'+r.total+' '+medal(b):'—')+'</td></tr>'}).join("");
 return headerHTML("Meu resultado 📋",esc(S.name||""))+'<main><div class="card"><table class="t"><tr><th>Trilha</th><th>Melhor resultado</th></tr>'+rows+'<tr><td>🏆 Desafio final</td><td>'+S.final+'/10</td></tr><tr><td>🃏 Cartas</td><td>'+S.cards.length+'/24</td></tr><tr><td>🔁 Para revisar</td><td>'+S.wrong.length+'</td></tr></table></div>'+
 '<div class="card"><b>Para o professor</b><div class="small">Mostre esta tela ou copie o resumo abaixo e envie por mensagem. Os dados ficam salvos neste aparelho.</div><pre class="code" id="rs">'+esc(resumo())+'</pre><button class="btn" onclick="copyRes()">📋 Copiar resumo</button></div>'+
 (done===6?'<button class="btn" onclick="go(\'cert\')">🎓 Meu certificado de Guardião dos Biomas</button>':'<div class="small" style="text-align:center">Conclua as 6 trilhas ('+done+'/6) para liberar o certificado.</div>')+
 '<button class="btn sec" onclick="go(\'fontes\')">📚 Fontes do conteúdo</button>'+
 '<button class="btn sec" onclick="changeName()">✏️ Mudar nome</button>'+
 '<button class="btn sec" onclick="resetAsk()">🗑️ Apagar meu progresso</button></main>';
}
function copyRes(){
 var t=resumo();
 function fallback(){var ta=document.createElement("textarea");ta.value=t;document.body.appendChild(ta);ta.select();try{document.execCommand("copy")}catch(e){}document.body.removeChild(ta);toast()}
 if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(toast,fallback)}else fallback();
}
function toast(){var b=document.querySelector("button[onclick='copyRes()']");if(b){b.textContent="✅ Copiado!"}}
function changeName(){view="name";render()}
function resetAsk(){
 var b=document.querySelector("button[onclick='resetAsk()']");
 if(b.dataset.s==="1"){S={name:S.name,xp:0,trails:{},wrong:[],got:{},cards:[],mitos:{},final:0,finalTries:0};save();go("home")}
 else{b.dataset.s="1";b.textContent="Toque de novo para confirmar";setTimeout(function(){if(b){b.dataset.s="";b.textContent="🗑️ Apagar meu progresso"}},4000)}
}

/* ============ FONTES ============ */
function vFontes(){
 return headerHTML("Fontes 📚","De onde vêm os dados")+'<main><div class="card"><ul>'+FONTES.map(function(f){return'<li style="margin-bottom:8px">'+f+'</li>'}).join("")+'</ul><p class="small">Conteúdo conferido em novembro de 2026. Dados de desmatamento e a lista de espécies ameaçadas mudam todo ano.</p></div><button class="btn sec" onclick="go(\'result\')">Voltar</button></main>';
}

/* ============ CERTIFICADO ============ */
function vCert(){
 var d=new Date();var ds=d.toLocaleDateString("pt-BR",{day:"2-digit",month:"long",year:"numeric"});
 return headerHTML("Certificado 🎓","Você completou as 6 trilhas!")+'<main><div id="certArea"><div class="cert"><div style="font-size:44px">🌎🌳🌵</div><h2>Guardião dos Biomas</h2><div>Certificamos que</div><div class="nm">'+esc(S.name)+'</div><div>concluiu as trilhas da <b>Amazônia, Cerrado, Mata Atlântica, Caatinga, Pampa e Pantanal</b> e conquistou '+S.xp+' XP.</div><div class="small" style="margin-top:12px">Ciências • 7º ano • '+ds+'</div></div></div><button class="btn" onclick="window.print()">🖨️ Imprimir / salvar em PDF</button><button class="btn sec" onclick="go(\'result\')">Voltar</button></main>';
}

/* ============ INÍCIO ============ */
view=S.name?"home":"name";
render();
</script>
</body>
</html>
