# Publica o app no GitHub Pages a cada push na main.
# A versão do cache do service worker é trocada automaticamente pelo
# código do commit, para os aparelhos sempre baixarem a versão nova.
name: Publicar app (GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Montar o site
        run: |
          mkdir _site
          cp index.html manifest.webmanifest sw.js _site/
          cp -r icons _site/
          VERSAO="biomas-${GITHUB_SHA::8}"
          sed -i -E "s/const CACHE = \"[^\"]*\";/const CACHE = \"${VERSAO}\";/" _site/sw.js
          grep -q "const CACHE = \"${VERSAO}\";" _site/sw.js
          touch _site/.nojekyll
          echo "Versão do cache: ${VERSAO}"

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
